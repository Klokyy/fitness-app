<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness offline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7468">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one column on the phone (cards stacked, number pad docked at the bottom),
   three day columns on the desktop. Rows of reps use the Excel colours: pull blue, dip orange. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#17212c; --ink-2:#4a5968; --muted:#75828f; --line:#d3dae1;
  --accent:#0e7468; --accent-ink:#ffffff; --accent-soft:#d9efeb;
  --pull:#2a78d6; --pull-soft:#e6f0fb; --dip:#d9541f; --dip-soft:#fcece4;
  --heavy:#c23535; --heavy-soft:#fae6e6; --volume:#2463b8; --volume-soft:#e3edf9; --third:#9a6a00; --third-soft:#f8eed3;
  --crit:#c23535; --good:#1f8a3b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#18212a; --surface-2:#1f2a35; --ink:#e9eef3; --ink-2:#b0bcc8; --muted:#8492a0; --line:#2d3a47;
    --accent:#3cc6b4; --accent-ink:#062822; --accent-soft:#143a36;
    --pull:#62a8f5; --pull-soft:#16304d; --dip:#f58f63; --dip-soft:#46251a;
    --heavy:#f07a7a; --heavy-soft:#472020; --volume:#72aef5; --volume-soft:#182f4c; --third:#e5b54a; --third-soft:#40330f;
    --crit:#f07a7a; --good:#5fce7c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --surface-2:#1f2a35; --ink:#e9eef3; --ink-2:#b0bcc8; --muted:#8492a0; --line:#2d3a47;
  --accent:#3cc6b4; --accent-ink:#062822; --accent-soft:#143a36;
  --pull:#62a8f5; --pull-soft:#16304d; --dip:#f58f63; --dip-soft:#46251a;
  --heavy:#f07a7a; --heavy-soft:#472020; --volume:#72aef5; --volume-soft:#182f4c; --third:#e5b54a; --third-soft:#40330f;
  --crit:#f07a7a; --good:#5fce7c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.shell{max-width:1120px;margin:0 auto;padding:12px 16px 104px}
body.pad-open .shell{padding-bottom:300px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.now{font-size:14px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.spacer{flex:1}
.status{font-size:13px;color:var(--muted)}
.status.warn{color:var(--crit);font-weight:600}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav-top{display:none}
.nav-bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px;z-index:20}
.nav-bottom button{flex:1;padding:12px 6px;font-size:16px}
body.pad-open .nav-bottom{display:none}
@media (min-width:900px){.nav-top{display:flex}.nav-bottom{display:none}.shell{padding-bottom:40px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 8px;white-space:nowrap}
.pill.volume{background:var(--volume-soft);color:var(--volume)} .pill.heavy{background:var(--heavy-soft);color:var(--heavy)}
.pill.pyramid,.pill.highreps{background:var(--third-soft);color:var(--third)} .pill.plain{background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
code{font-family:var(--body);font-weight:600;background:var(--surface-2);border-radius:5px;padding:1px 6px;white-space:nowrap}

.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.weekbar h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;height:40px;font-size:18px;font-weight:600}
.iconbtn:disabled{opacity:.35;cursor:default}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.daytab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px}
.daytab .dw{font-weight:700;font-size:15px} .daytab .dn{font-size:12px;color:var(--muted)}
.daytab .dot{width:18px;height:4px;border-radius:2px;background:transparent}
.daytab.volume .dot{background:var(--volume)} .daytab.heavy .dot{background:var(--heavy)} .daytab.pyramid .dot,.daytab.highreps .dot{background:var(--third)}
.daytab[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.daytab.today .dw{text-decoration:underline;text-underline-offset:3px}
.daytab.rest{background:transparent}

.dayhead h2{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.05}
.focus{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px}
.focus .label{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.blk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kg{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.blk-kind{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plan{font-weight:600;font-size:17px}
.sum{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);white-space:nowrap}
.gridwrap{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.grid{display:grid;gap:6px;align-items:center;min-width:min-content}
.grid .gh{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.grid .gl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.gl.pu{color:var(--pull)} .gl.dip{color:var(--dip)}
.cell{height:54px;min-width:40px;border-radius:10px;border:1.5px solid transparent;font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1;padding:0}
.cell.pu{background:var(--pull-soft)} .cell.dip{background:var(--dip-soft)} .cell.rpe{background:var(--surface-2);min-width:64px;height:46px;font-size:24px}
.cell.empty{color:var(--muted);font-weight:500;font-size:20px;opacity:.75}
.cell.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.addset{height:54px;min-width:30px;padding:0;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:22px}
.rperow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.rperow .label{flex:1 0 100%}
.last{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.last b{font-variant-numeric:tabular-nums;color:var(--ink)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.txt-blocks{display:grid;gap:12px}
@media (min-width:700px){.txt-blocks{grid-template-columns:repeat(3,1fr)}}
textarea,input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}

.pad{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--ink);padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.pad-inner{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:10px}
.pad-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pad-title strong{font-family:var(--display);font-size:22px;letter-spacing:.02em}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.opt{flex:0 0 auto;min-width:54px;height:54px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;padding:0 8px}
.opt.base{border-color:var(--ink)} .opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pad-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad-actions .btn{padding:12px 4px;font-size:16px}

.wk-head{display:grid;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600} .kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.cols{display:grid;gap:12px}
@media (min-width:900px){.cols{grid-template-columns:repeat(3,1fr);align-items:start}}
.daycard h3{font-family:var(--display);font-size:24px;font-weight:700}
.daycard .sec{margin-top:10px} .daycard .sec .label{display:block;margin-bottom:2px}
.logged{font-variant-numeric:tabular-nums;font-size:14px;background:var(--surface-2);border-radius:8px;padding:6px 8px;margin-top:6px}
table{border-collapse:collapse;width:100%}
.others td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top} .others td:first-child{font-weight:700;width:48px}
pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border-radius:8px;padding:10px;overflow-x:auto;margin:0}

.form{display:grid;gap:10px}
.fgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
.blkrow{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);display:grid;gap:8px}

.xwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.xt{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xt th,.xt td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
.xt th{background:var(--surface-2);font-weight:700;position:sticky;top:0}
.xt td.l,.xt th.l{text-align:left} .xt td.note{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.xt th.pu{color:var(--pull)} .xt th.dip{color:var(--dip)}
.xt tr.first td{border-top:2px solid var(--ink-2)}
.lgrid{display:grid;grid-template-columns:72px repeat(3,minmax(0,1fr));gap:0}
.lgrid>div{padding:8px 10px;border-top:1px solid var(--line)}
.lgrid .lh{border-top:0;padding-top:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lgrid .ld{font-weight:700;display:flex;flex-direction:column;gap:2px}
.lgrid .ld small{font-weight:500;color:var(--muted)}
.lgrid .lc{display:flex;flex-direction:column;gap:5px;min-width:0}
.lgrid .lc select,.lgrid .lc input{padding:6px 8px;font-size:14px}
.lgrid .lc .how{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.lgrid .lc .lcap{display:none}
.lgrid .wk{font-size:14px;font-weight:600}
.lgrid .today-row{background:var(--accent-soft)}
@media (max-width:899px){.lgrid{grid-template-columns:1fr}.lgrid .lh{display:none}.lgrid .ld{flex-direction:row;gap:8px;align-items:baseline;border-top:2px solid var(--ink-2);padding-top:12px}
  .lgrid .lc{border-top:0;padding-top:2px}.lgrid .lc .lcap{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}}
.micro{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.micro div{font-size:14px;line-height:1.35}.micro b{font-weight:700}.micro .mf{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.remind{border-left:4px solid var(--third);background:var(--third-soft);border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.remind .label{color:var(--third)}
.layer-ro{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.layer-ro:first-child{border-top:0}
.notice{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.cell,.opt,.chip{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="brand">Fitness</span>
    <span class="now" id="now" hidden></span>
    <nav class="tabs nav-top" aria-label="Pohledy"></nav>
    <span class="spacer"></span>
    <span class="status" id="status" role="status"></span>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs nav-bottom" aria-label="Pohledy"></nav>
<div id="pad"></div>
<script>
/* Offline verze: data jen v tomto telefonu (localStorage). Stejné rozhraní jako úložiště appky. */
window.FITNESS_LOCAL=true;
(function(){
  var KEY='fitness-local-db-v1', store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){store={};}
  ['weeks','logs','ref'].forEach(function(c){store[c]=store[c]||{};});
  var subs=[];
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  function cl(o){return JSON.parse(JSON.stringify(o));}
  function ds(c,i){var d=store[c]&&store[c][i];return {id:i,exists:!!d,data:function(){return d?cl(d):undefined;},metadata:{fromCache:false,hasPendingWrites:false}};}
  function cs(c){var ids=Object.keys(store[c]||{}).sort();return {docs:ids.map(function(i){return ds(c,i);}),size:ids.length,empty:!ids.length,metadata:{fromCache:false,hasPendingWrites:false}};}
  function fire(){subs.forEach(function(f){setTimeout(f,0);});}
  var db={
    collection:function(c){return {onSnapshot:function(n){var f=function(){n(cs(c));};subs.push(f);setTimeout(f,0);return function(){};},doc:function(i){return db.doc(c+'/'+i);}};},
    doc:function(p){var a=p.split('/'),c=a[0],i=a[1];store[c]=store[c]||{};
      return {id:i,path:p,
        set:function(d){store[c][i]=cl(d);save();fire();return Promise.resolve();},
        get:function(){return Promise.resolve(ds(c,i));},
        delete:function(){delete store[c][i];save();fire();return Promise.resolve();},
        onSnapshot:function(n){var f=function(){n(ds(c,i));};subs.push(f);setTimeout(f,0);return function(){};}};}
  };
  window.addEventListener('storage',function(e){if(e.key===KEY){try{var s2=JSON.parse(e.newValue||'{}');Object.keys(s2).forEach(function(k){store[k]=s2[k];});fire();}catch(x){}}});
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:null);}};
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>
<script>
(function(){
'use strict';
var MODE=window.FITNESS_LOCAL?'local':'cloud';
var OFFLINE_URL=window.FITNESS_OFFLINE_URL||'https://klokyy.github.io/fitness-offline/';   /* adresa offline verze (GitHub Pages) */
var CLOUD_URL='https://claude.ai/artifact/MUYYqe7hKFKkVggLUZzZ29';
/*LOGIC-START*/
var COLS=['Date','Typ','Intent','Schéma','kg','Plán sety','Plán PU','Plán Dip','Cíl RPE',
  'PU1','PU2','PU3','PU4','PU5','PU6','PU7','PU8','PU9','D1','D2','D3','D4','D5','D6','D7','D8','D9',
  'RPE PU','RPE Dip','RPE trénink','Před','Poznámka'];
function isLog(b){return b.type==='main'||b.type==='backoff'||b.type==='control';}
function has(v){return v!==null&&v!==undefined&&v!=='';}
function vals(a){return (a||[]).filter(has);}
function topKg(b){return Math.max.apply(null,b.steps.map(function(s){return s.kg;}));}
function blockTyp(b){return b.typ||(b.type==='control'?'Control':'Klasika');}
/* One training day -> rows of the Excel log. 1 row = 1 weight; back-off and control get their own row;
   a pyramid is one row on its top weight with the whole pyramid in the note; high reps carry no plan. */
function rowsForDay(day,log){
  var rows=[]; if(!day||!log||!day.blocks) return rows;
  var L=log.blocks||{}, pyrNote='';
  day.blocks.forEach(function(b){
    if(!isLog(b)) return;
    var e=L[b.id]||{}, typ=blockTyp(b), r={Date:day.date,Typ:typ,Intent:day.intent||''};
    if(b.steps){
      var top=topKg(b), pu=[], dip=[], parts=[], plan=null;
      b.steps.forEach(function(s,i){
        var p=(e.pu||[])[i], d=(e.dip||[])[i];
        if(has(p)||has(d)) parts.push(s.kg+'×'+(has(p)?p:'–')+'/'+(has(d)?d:'–'));
        if(s.kg===top){ if(has(p)) pu.push(p); if(has(d)) dip.push(d); if(!plan&&has(s.pu)) plan=s; }
      });
      if(!parts.length) return;
      r['Schéma']='Pyramida'; r.kg=top;
      if(plan){ r['Plán sety']=b.steps.filter(function(s){return s.kg===top;}).length; r['Plán PU']=plan.pu; if(has(plan.dip)) r['Plán Dip']=plan.dip; }
      if(has(b.rpe)) r['Cíl RPE']=b.rpe;
      pu.forEach(function(v,i){r['PU'+(i+1)]=v;}); dip.forEach(function(v,i){r['D'+(i+1)]=v;});
      if(has(e.rpePu)) r['RPE PU']=e.rpePu; if(has(e.rpeDip)) r['RPE Dip']=e.rpeDip;
      pyrNote=parts.join(' · ');
      rows.push(r); return;
    }
    var pus=vals(e.pu).slice(0,9), dips=vals(e.dip).slice(0,9);
    if(!pus.length&&!dips.length) return;
    r.kg=b.kg||0;
    if(typ==='High reps'){ r['Schéma']=''; }
    else if(b.type==='main'){
      r['Schéma']=day.schema||'';
      if(has(b.pu)||has(b.dip)){ r['Plán sety']=b.sets||1; if(has(b.pu)) r['Plán PU']=b.pu; if(has(b.dip)) r['Plán Dip']=b.dip; }
      if(has(b.rpe)) r['Cíl RPE']=b.rpe;
    } else if(b.type==='backoff'){ r['Schéma']=day.schema||''; }
    else { r['Schéma']=''; }
    pus.forEach(function(v,i){r['PU'+(i+1)]=v;}); dips.forEach(function(v,i){r['D'+(i+1)]=v;});
    if(b.type==='main'){ if(has(e.rpePu)) r['RPE PU']=e.rpePu; if(has(e.rpeDip)) r['RPE Dip']=e.rpeDip; }
    rows.push(r);
  });
  if(rows.length){
    if(has(log.rpe)) rows[0]['RPE trénink']=log.rpe;
    if(has(log.pre)) rows[0]['Před']=log.pre;
    var note=[pyrNote,(log.note||'').trim()].filter(Boolean).join(' · ');
    if(note) rows[0]['Poznámka']=note;
  }
  return rows;
}
function fmtCell(col,v){

function setStatus(){

  if(S.dbState==='loading') t='Načítám data…';
  else if(S.dbState==='slow'){t='Data se zatím nedaří načíst';warn=true;}
  else if(S.dbState==='none'){t='Úložiště není dostupné — změny se neuloží';warn=true;}
  else if(S.dbState==='revoked'){t='Přístup k datům skončil — obnov stránku';warn=true;}
  else if(MODE==='local'){t=anyDirty()?'Ukládám…':'Uloženo v telefonu';}
  else if(S.offline&&anyDirty()){t='Offline · zápis je v telefonu, odešle se po připojení';warn=true;}
  else if(S.offline){t='Offline · plán je načtený';}
  else if(S.saveErr){t='Neodesláno · zápis je v telefonu, zkouším znovu';warn=true;}
  else if(anyDirty()) t='Ukládám…';
  else t='Uloženo';
  el.textContent=t; el.className='status'+(warn?' warn':'');
}
function anyDirty(){return Object.keys(S.dirty).some(function(k){return S.dirty[k];})||Object.keys(S.wdirty).some(function(k){return S.wdirty[k];});}

function touchWeek(id){var w=S.weeks[id]; if(!w) return; w.updatedAt=Date.now(); S.wdirty[id]=true; setStatus();
  clearTimeout(S.wtimers[id]); S.wtimers[id]=setTimeout(function(){flushWeek(id);},700);}
function flushWeek(id){
  if(!S.db||!S.weeks[id]) return;
  if(S.winflight[id]){S.wagain[id]=true;return;}
  S.winflight[id]=true; var sent=S.weeks[id].updatedAt;
  S.db.doc('weeks/'+id).set(clone(S.weeks[id])).then(function(){
    S.winflight[id]=false; S.saveErr=false;
    if(S.wagain[id]||S.weeks[id].updatedAt!==sent){S.wagain[id]=false;flushWeek(id);} else S.wdirty[id]=false;
    setStatus();
  }).catch(function(e){
    S.winflight[id]=false; S.saveErr=true; setStatus();

function start(){

  }

        if(k&&k.indexOf('fitness-draft-')===0){ var dt=k.slice(14), d0=getDraft(dt); if(d0&&!S.logs[dt]){S.logs[dt]=d0;S.dirty[dt]=true;flush(dt);} } } }catch(e){} }

    },fail);
    db.doc('ref/excel').onSnapshot(function(snap){S.ref=snap.exists?clone(snap.data()):null;softRender();},function(){});

function padBase(p){

  var last=rows[rows.length-1];

}
function padOptions(p){

  if(a==='newweek'){S.edit=newWeekFrom(w);S.tab='tyden';S.msg='Nový týden — uprav a ulož.';render();window.scrollTo(0,0);return;}
  if(a==='xf'){S.xfilter=t.dataset.v;S.msg='';render();return;}
  if(a==='xhead'){S.xhead=t.checked;render();return;}
  if(a==='copy'){var all=[];exportDays().forEach(function(x){all=all.concat(x.rows);}); var text=toTSV(all,S.xhead);
    var done=function(ok){S.msg=ok?'Zkopírováno. Vlož do Excelu (Ctrl+V).':'Kopírování tu nejde — označ text níž a zkopíruj ručně.';S.showTsv=!ok;render(); if(!ok){var ta=$('#tsv'); if(ta){ta.focus();ta.select();}}};
    try{navigator.clipboard.writeText(text).then(function(){done(true);},function(){done(false);});}catch(e){done(false);} return;}
  if(a==='b-copy-plan'){copyText(bundleText('plan',planBundle()),'Plán zkopírovaný. Otevři offline verzi → Přenos → Vložit plán.','b-plan');return;}
  if(a==='b-copy-logs'){var lgs=Object.keys(S.logs).map(function(d){return S.logs[d];}).filter(hasReps);
    copyText(bundleText('zapis',{logs:lgs}),'Zápis zkopírovaný. V appce: Export → Vložit zápis.','b-logs');return;}
  if(a==='b-import-logs'){importLogsCloud(($('#b-in')||{}).value);return;}
  if(a==='b-import-plan'){importPlanLocal(($('#b-in')||{}).value);return;}
  if(a==='b-paste'){try{navigator.clipboard.readText().then(function(tx){var ta=$('#b-in'); if(ta) ta.value=tx; importPlanLocal(tx);},function(){S.msg3='Schránku nejde přečíst — vlož text ručně (podržet → Vložit).';render();});}catch(e){S.msg3='Schránku nejde přečíst — vlož text ručně.';render();} return;}
  if(a==='xmark'){var lg2=getLog(t.dataset.date,false); if(!lg2) return; if(lg2.excel) delete lg2.excel; else lg2.excel=today(); touch(t.dataset.date); render(); return;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.layer&&t.tagName==='INPUT'){setLayer(S.weekId,t.dataset.date,t.dataset.layer,'note',t.value);return;}
  if(t.dataset.act==='note'){var l=getLog(S.dayDate,true); l.note=t.value; touch(S.dayDate); return;}
  if(t.dataset.path&&S.edit){var v=t.value; if(t.dataset.num) v=v===''?null:Number(v.replace(',','.')); setPath(S.edit,t.dataset.path,v);}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset.layer&&t.tagName==='SELECT'){setLayer(S.weekId,t.dataset.date,t.dataset.layer,'pick',t.value);render();return;} if(t.dataset.path&&S.edit&&t.tagName==='SELECT'){setPath(S.edit,t.dataset.path,t.value);}
  if(t.dataset.act==='xhead'){S.xhead=t.checked;render();}
});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending&&!typing()) render();},50);});
window.addEventListener('hashchange',function(){var h=location.hash.replace('#','');if(['dnes','tyden','export'].indexOf(h)>=0&&h!==S.tab){S.tab=h;S.pad=null;render();}});
(function(){var h=location.hash.replace('#','');if(['dnes','tyden','export'].indexOf(h)>=0)S.tab=h;})();
start();
})();
</script>
</body>
</html>
